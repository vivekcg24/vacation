# Site-wide configuration for Jekyll / GitHub Pages
site_title: Family Vacation Planning
short_name: Family Vacations
description: Our family's vacation planning and travel guide - destinations, budgets, itineraries

#url: 'https://yourdomain.github.io'  # Optional: Set to your actual domain if hosted on GitHub/GitLab
baseurl: '/'                         # Remove this line when deploying locally or set to '/family-vacations'

# Site settings for themes and plugins (recommended)
theme: jekyll-theme-slate          # Built-in minimalist theme; alternatives below
permalink: pretty                  # Pretty URLs like /2024/10/my-post-title.html
defaults:
  - scope:
      path: ''                      # Applies to all files in project root
    values:
      layout: default               # Default page layout (no sidebar, clean design)

# Navigation bar configuration for GitHub Pages top menu
navbar: false                     # Disable navbar by removing this line or set true if you create _nav.md file later
show_navbar: false                # Alternative setting to hide/hide nav bars from built-in themes

# Exclude files not needed in production build
exclude:
  - .editorconfig                  # Editor formatting config (optional)
  - LICENSE                        # If using custom license
  - README.md                      # Your main documentation file already handled separately
  
## Other common theme options to consider (change these lines instead):
# theme: jekyll-theme-minimal     # Simplest, no sidebar or footer  
# theme: jekyll-theme-cayman      # Classic clean design
# theme: just-the-docs            # Professional documentation style (requires additional setup)
